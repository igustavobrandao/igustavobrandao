  <text x="62" y="177" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" letter-spacing="-4">GUSTAVO</text>
  <text x="62" y="260" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" letter-spacing="-4">BRANDÃO.</text>
