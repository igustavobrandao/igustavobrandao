  <circle cx="1020" cy="196" r="65" fill="#5de2d0" fill-opacity=".09" />
  <path d="m972 176-28 20 28 20m96-40 28 20-28 20m-33-61-28 83" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
